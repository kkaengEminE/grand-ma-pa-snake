<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grand Ma/Pa Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #game-container {
      width: 100%; height: 100%;
      position: relative;
    }
    canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0; }

    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; font-family: 'Segoe UI', sans-serif;
      z-index: 5;
    }

    #hp-bar-container {
      position: absolute; top: 20px; left: 20px;
      width: 200px; height: 24px;
      background: rgba(0,0,0,0.5); border-radius: 12px;
      border: 2px solid #333; overflow: hidden;
    }
    #hp-bar {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #ff6b6b, #ee5a24);
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    #hp-text {
      position: absolute; top: 22px; left: 24px;
      color: white; font-size: 11px; font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      line-height: 24px;
    }

    #score-display {
      position: absolute; top: 20px; right: 20px;
      color: white; font-size: 20px; font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    #animal-count {
      position: absolute; top: 50px; right: 20px;
      color: #ffd93d; font-size: 16px; font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    #sweat-indicator {
      position: absolute; top: 52px; left: 20px;
      color: #74b9ff; font-size: 14px; font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      opacity: 0; transition: opacity 0.3s;
    }
    #sweat-indicator.active { opacity: 1; }

    #ghost-indicator {
      position: absolute; top: 74px; left: 20px;
      color: #a29bfe; font-size: 14px; font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      opacity: 0; transition: opacity 0.3s;
    }
    #ghost-indicator.active { opacity: 1; }

    #title-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 40%, #7BC67E 60%, #5A9E5A 100%);
      pointer-events: all; z-index: 10;
    }
    #title-screen h1 {
      font-size: 72px; color: #2d3436;
      text-shadow: 4px 4px 0 #fdcb6e, 8px 8px 0 rgba(0,0,0,0.1);
      font-family: 'Georgia', serif; margin-bottom: 10px;
      letter-spacing: 4px;
    }
    #title-screen .subtitle {
      font-size: 18px; color: #636e72; margin-bottom: 50px;
      font-style: italic;
    }
    .char-select {
      display: flex; gap: 40px; margin-bottom: 40px;
    }
    .char-option {
      width: 140px; height: 180px;
      background: rgba(255,255,255,0.85);
      border-radius: 20px; border: 4px solid #dfe6e9;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: all 0.2s; pointer-events: all;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .char-option:hover {
      transform: translateY(-8px);
      border-color: #fdcb6e;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    .char-option .emoji { font-size: 64px; margin-bottom: 10px; }
    .char-option .label {
      font-size: 18px; font-weight: bold; color: #2d3436;
    }

    #game-over-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7);
      pointer-events: all; z-index: 10;
    }
    #game-over-screen.visible { display: flex; }
    #game-over-screen h2 {
      font-size: 48px; color: #ff6b6b;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    #game-over-screen .final-score {
      font-size: 28px; color: #ffd93d; margin-bottom: 30px;
    }
    #restart-btn {
      padding: 15px 40px; font-size: 20px;
      background: #00b894; color: white; border: none;
      border-radius: 12px; cursor: pointer;
      pointer-events: all; font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    #restart-btn:hover { transform: scale(1.05); }

    #controls-hint {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6); font-size: 13px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div id="hp-bar-container"><div id="hp-bar"></div></div>
      <div id="hp-text">HP 100/100</div>
      <div id="sweat-indicator">💦 Sweating!</div>
      <div id="ghost-indicator">👻 Ghost Mode</div>
      <div id="score-display">Score: 0</div>
      <div id="animal-count">🐤 x 0</div>
      <div id="controls-hint">Arrow Keys: Move | Space: Rest on Bench</div>
    </div>

    <div id="title-screen">
      <h1>Grand Ma/Pa Snake</h1>
      <div class="subtitle">A Slow-Life Snake Adventure</div>
      <div class="char-select">
        <div class="char-option" id="select-grandpa">
          <div class="emoji">👴</div>
          <div class="label">Grandpa</div>
        </div>
        <div class="char-option" id="select-grandma">
          <div class="emoji">👵</div>
          <div class="label">Grandma</div>
        </div>
      </div>
    </div>

    <div id="game-over-screen">
      <h2>Oh no!</h2>
      <div class="final-score" id="final-score">Score: 0</div>
      <button id="restart-btn">Try Again</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
